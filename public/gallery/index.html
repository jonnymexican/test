<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#161519" />
    <meta name="description" content="The gallery — original paintings, straight from the studio." />
    <title>The Gallery</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        background: linear-gradient(165deg, #161519 0%, #1e1a22 55%, #262030 100%);
        color: #ece9f0;
        padding: 2rem 1rem 4rem;
      }
      main { max-width: 56rem; margin: 0 auto; }
      h1 {
        margin: 0 0 0.3rem;
        font-size: 1.9rem;
        background: linear-gradient(90deg, #fff3d6, #f3c98b, #e8a0a8);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .tagline { margin: 0 0 1.4rem; color: rgba(236, 233, 240, 0.6); font-size: 0.95rem; }
      .status { color: rgba(236, 233, 240, 0.55); font-size: 0.9rem; margin: 0 0 1rem; }
      .show { margin: 0 0 2rem; }
      .show-title { font-size: 1.05rem; margin: 0 0 0.7rem; color: #f3c98b; }
      .wall { display: grid; grid-template-columns: repeat(auto-fill, minmax(11rem, 1fr)); gap: 0.8rem; }
      figure {
        margin: 0; padding: 0.5rem 0.5rem 0.6rem;
        background: rgba(255, 255, 255, 0.045);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 14px; cursor: zoom-in;
        transition: border-color 0.15s ease, transform 0.15s ease;
      }
      figure:hover { border-color: rgba(243, 201, 139, 0.6); transform: translateY(-2px); }
      figure img {
        width: 100%; height: 10rem; object-fit: contain; display: block;
        border-radius: 8px; background: rgba(0, 0, 0, 0.28);
      }
      figcaption {
        margin-top: 0.45rem; font-size: 0.78rem; line-height: 1.35;
        color: rgba(236, 233, 240, 0.65); overflow-wrap: anywhere;
      }
      .lb {
        position: fixed; inset: 0; z-index: 80;
        background: rgba(8, 7, 11, 0.94);
        display: flex; align-items: center; justify-content: center;
        flex-direction: column; gap: 0.9rem; padding: 2.5rem 3.5rem;
      }
      .lb[hidden] { display: none; }
      .lb-img {
        max-width: min(92vw, 1300px); max-height: 78vh; object-fit: contain;
        border-radius: 6px; box-shadow: 0 12px 70px rgba(0, 0, 0, 0.65);
      }
      .lb-cap { color: rgba(236, 233, 240, 0.88); font-size: 0.95rem; text-align: center; max-width: 80vw; }
      .lb-count { color: rgba(236, 233, 240, 0.4); font-size: 0.8rem; }
      .lb-btn {
        position: fixed; background: rgba(255, 255, 255, 0.07);
        border: 1px solid rgba(255, 255, 255, 0.18); color: #ece9f0;
        width: 2.6rem; height: 2.6rem; border-radius: 50%;
        font-size: 1.2rem; cursor: pointer; line-height: 1;
        transition: background 0.15s ease, border-color 0.15s ease;
      }
      .lb-btn:hover { background: rgba(243, 201, 139, 0.18); border-color: rgba(243, 201, 139, 0.6); }
      .lb-prev { left: 1rem; top: 50%; transform: translateY(-50%); }
      .lb-next { right: 1rem; top: 50%; transform: translateY(-50%); }
      .lb-close { right: 1rem; top: 1rem; }
      footer { margin-top: 2rem; font-size: 0.78rem; color: rgba(236, 233, 240, 0.4); text-align: center; }
      a { color: rgba(243, 201, 139, 0.9); }
      .hang-btn {
        display: inline-block; padding: 0.45rem 1rem; border-radius: 999px;
        background: rgba(243, 201, 139, 0.12); border: 1px solid rgba(243, 201, 139, 0.5);
        font-weight: 600; text-decoration: none;
      }
      .hang-btn:hover { background: rgba(243, 201, 139, 0.2); }
    </style>
  </head>
  <body>
    <main>
      <h1>The Gallery</h1>
      <p class="tagline">Original works, straight from the studio. Click any piece to see it up close.</p>
      <p class="status" id="status">Hanging the show…</p>
      <p style="margin:-0.5rem 0 1rem"><a class="hang-btn" href="./upload.html">🖼️ Hang a painting</a></p>
      <div id="shows"></div>
      <footer>
        The art lives in the
        <a href="https://github.com/jonnymexican/art">art archive</a> as release assets.
        Part of <a href="/test/hub.html">Jon's Apps</a>.
      </footer>
    </main>

    <div class="lb" id="lb" hidden role="dialog" aria-label="Artwork viewer">
      <img class="lb-img" id="lb-img" alt="" />
      <p class="lb-cap" id="lb-cap"></p>
      <p class="lb-count" id="lb-count"></p>
      <button class="lb-btn lb-prev" id="lb-prev" type="button" aria-label="Previous artwork">‹</button>
      <button class="lb-btn lb-next" id="lb-next" type="button" aria-label="Next artwork">›</button>
      <button class="lb-btn lb-close" id="lb-close" type="button" aria-label="Close viewer">✕</button>
    </div>

    <script type="module">
      import { collectArtwork, allImages, fmtSize } from './gallery.js';

      (function () {
        var API = 'https://api.github.com/repos/jonnymexican/art/releases?per_page=100';
        var statusEl = document.getElementById('status');
        var showsEl = document.getElementById('shows');
        var lb = document.getElementById('lb');
        var lbImg = document.getElementById('lb-img');
        var lbCap = document.getElementById('lb-cap');
        var lbCount = document.getElementById('lb-count');
        var flat = [];
        var idx = 0;

        function openLightbox(i) {
          idx = (i + flat.length) % flat.length;
          var im = flat[idx];
          lbImg.src = im.src;
          lbImg.alt = im.caption;
          lbCap.textContent = im.caption;
          lbCount.textContent = (idx + 1) + ' of ' + flat.length + ' · ' + fmtSize(im.size);
          lb.hidden = false;
          document.body.style.overflow = 'hidden';
        }
        function closeLightbox() {
          lb.hidden = true;
          lbImg.src = '';
          document.body.style.overflow = '';
        }

        document.getElementById('lb-prev').addEventListener('click', function () { openLightbox(idx - 1); });
        document.getElementById('lb-next').addEventListener('click', function () { openLightbox(idx + 1); });
        document.getElementById('lb-close').addEventListener('click', closeLightbox);
        lb.addEventListener('click', function (e) { if (e.target === lb) closeLightbox(); });
        document.addEventListener('keydown', function (e) {
          if (lb.hidden) return;
          if (e.key === 'Escape') closeLightbox();
          else if (e.key === 'ArrowLeft') openLightbox(idx - 1);
          else if (e.key === 'ArrowRight') openLightbox(idx + 1);
        });

        fetch(API)
          .then(function (r) {
            if (!r.ok) throw new Error('GitHub API said ' + r.status);
            return r.json();
          })
          .then(function (list) {
            var shows = collectArtwork(list);
            flat = allImages(shows);
            shows.forEach(function (show) {
              var sec = document.createElement('section');
              sec.className = 'show';
              var h = document.createElement('h2');
              h.className = 'show-title';
              h.textContent = show.title;
              sec.appendChild(h);
              var wall = document.createElement('div');
              wall.className = 'wall';
              show.images.forEach(function (im) {
                var i = flat.indexOf(im);
                var fig = document.createElement('figure');
                var img = document.createElement('img');
                img.loading = 'lazy';
                img.src = im.src;
                img.alt = im.caption;
                var cap = document.createElement('figcaption');
                cap.textContent = im.caption;
                fig.appendChild(img);
                fig.appendChild(cap);
                fig.addEventListener('click', function () { openLightbox(i); });
                wall.appendChild(fig);
              });
              sec.appendChild(wall);
              showsEl.appendChild(sec);
            });
            statusEl.textContent = flat.length
              ? flat.length + ' work' + (flat.length === 1 ? '' : 's') + ' hanging across ' + shows.length + ' show' + (shows.length === 1 ? '' : 's') + '.'
              : 'The walls are bare — upload the first photos (see the art archive README).';
          })
          .catch(function (err) {
            statusEl.textContent = 'Could not reach the archive (' + err.message + '). Try refreshing.';
          });
      })();
    </script>
  </body>
</html>
