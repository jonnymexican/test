name: Sync vicinityGo mirror

on:
  push:
    branches: [main]
    paths:
      - 'vicinitygo/**'
      - '.github/workflows/sync-mirror.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-mirror
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # git subtree needs the full history to build the split
          fetch-depth: 0
          # don't persist the default GITHUB_TOKEN auth header; it would
          # override MIRROR_TOKEN on the push below (404 on private repo)
          persist-credentials: false

      - name: Push vicinitygo/ subtree to jonnymexican/vicinityGo
        env:
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
        run: |
          git config user.name "vicinitygo-sync"
          git config user.email "actions@users.noreply.github.com"
          git remote add mirror "https://x-access-token:${MIRROR_TOKEN}@github.com/jonnymexican/vicinityGo.git"
          git subtree push --prefix=vicinitygo mirror main
