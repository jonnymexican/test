name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test -- --include "src/**/*.test.js*" --include "src/**/*.smoke.test.*"

      - run: npm run build

      # Smoke-test vicinityGo's full flows too — a failure here blocks the
      # whole Pages deploy, not just the sub-app.
      - name: Smoke-test vicinityGo
        run: npm test -- --include "src/**/*.smoke.test.*"
        working-directory: vicinitygo

      - name: Build vicinityGo
        run: npm run build
        working-directory: vicinitygo

      - name: Bundle vicinityGo into the Pages artifact
        run: |
          mkdir -p dist/vicinitygo
          cp -r vicinitygo/dist/. dist/vicinitygo/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
