name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      # puzzleleague and vicinitygo resolve their dev deps from the root
      # node_modules (same versions pinned in their own lockfiles), so no
      # separate npm ci is needed — matching how vicinitygo already runs.

      # Full suite (vitest v5 has no --include CLI flag; the config's
      # include patterns already cover *.test.* and *.smoke.test.*)
      - run: npm test

      - run: npm run build

      # Smoke-test vicinityGo's full flows too — a failure here blocks the
      # whole Pages deploy, not just the sub-app.
      - name: Smoke-test vicinityGo
        run: npm test
        working-directory: vicinitygo

      - name: Build vicinityGo
        run: npm run build
        working-directory: vicinitygo

      - name: Bundle vicinityGo into the Pages artifact
        run: |
          mkdir -p dist/vicinitygo
          cp -r vicinitygo/dist/. dist/vicinitygo/

      # Daily Puzzle League rides the same artifact pipeline.
      - name: Test puzzleleague
        run: npm test
        working-directory: puzzleleague

      - name: Build puzzleleague
        run: npm run build
        working-directory: puzzleleague

      - name: Bundle puzzleleague into the Pages artifact
        run: |
          mkdir -p dist/puzzleleague
          cp -r puzzleleague/dist/. dist/puzzleleague/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
